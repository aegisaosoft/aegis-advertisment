<meta charset="utf-8">
<title>Scene 10 — the price list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@600;700&family=Noto+Sans+SC:wght@700;900&family=Noto+Sans+Armenian:wght@700;900&family=Noto+Sans+Georgian:wght@700;900&family=Noto+Naskh+Arabic:wght@700&family=Noto+Nastaliq+Urdu:wght@700&family=Source+Sans+3:wght@600;700;900&display=swap">

<style>
/*
 * The one shot in the ToonBee cut that has to be read, drawn instead of generated.
 *
 * Scene 10 is the price list — no subscription, no set-up fee, nothing per vehicle —
 * and the generator cannot letter it. Its first pass wrote "5tv" and "3s" on the price
 * discs; the regenerated pass cleared the discs and then span nonsense around them
 * ("S I S I A A T L M N U D O"). Three legible lines are the whole point of the scene,
 * so they are drawn here and composited over those six seconds.
 *
 * The ground is the film's own cyclorama, sampled off frame 65.0s: a warm light grey,
 * darker at the corners, brighter along the floor. Matching it is what lets the splice
 * fade in and out without announcing itself.
 */
:root{
  --plate:#dad7d2;
  --plate-edge:#c6c2bc;
  --floor:#e2ddd7;
  --ink:#22303f;
  --muted:#6b7a8a;
  --mark:#2f86d8;
  --mark-deep:#1f5fa8;
  --display:'Anton','Oswald','Noto Sans SC',"Arial Narrow",Impact,sans-serif;
  --body:'Source Sans 3','Noto Sans SC',"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:
    radial-gradient(120% 80% at 50% 96%, var(--floor) 0%, rgba(226,221,215,0) 55%),
    radial-gradient(105% 95% at 50% 38%, var(--plate) 0%, var(--plate-edge) 100%);
  color:var(--ink);font-family:var(--body);
  -webkit-font-smoothing:antialiased;
}

.stage{width:100vw;height:100vh;container-type:size;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6cqh}

/* "Nothing." — the answer, before the three reasons for it. */
.head{font-family:var(--display);font-size:17cqh;line-height:.9;letter-spacing:-.01em}

.row{display:flex;align-items:flex-start;justify-content:center;gap:3.5cqw}
/* Wide enough that the longest of the three labels still sits on one line: a row
   where one card wraps and the others do not reads as a mistake. */
.chip{width:29cqw;display:flex;flex-direction:column;align-items:center;gap:4cqh}

/*
 * A ring with a bar through it: the film's own three discs, reduced to the one shape
 * that means "none" without being lettered at all. The label under it does the reading.
 */
.mark{position:relative;width:21cqh;height:21cqh;border-radius:50%;
  border:2.3cqh solid var(--mark);
  background:radial-gradient(60% 60% at 35% 28%, rgba(255,255,255,.85), rgba(255,255,255,0));
  box-shadow:0 1.4cqh 2.6cqh rgba(31,95,168,.18), inset 0 0 1.2cqh rgba(255,255,255,.7)}
.mark::after{content:"";position:absolute;left:50%;top:50%;
  width:24cqh;height:2.3cqh;border-radius:1.2cqh;background:var(--mark-deep);
  transform:translate(-50%,-50%) rotate(-45deg)}

.label{font-size:4.3cqh;font-weight:900;line-height:1.16;text-align:center;
  text-transform:uppercase;letter-spacing:.06em;color:var(--ink)}

/*
 * The four scripts the display face has no letters for.
 *
 * A missing glyph is not an error a browser reports: it quietly borrows the letter
 * from somewhere else, and the card comes out in two typefaces. Each of these names
 * its own face first. Uppercasing is turned off with them — Armenian and Georgian
 * have a case the label does not want, and the Arabic scripts have none at all.
 */
.lang-hy{--display:'Noto Sans Armenian','Oswald',sans-serif;
         --body:'Noto Sans Armenian','Source Sans 3',sans-serif}
.lang-ka{--display:'Noto Sans Georgian','Oswald',sans-serif;
         --body:'Noto Sans Georgian','Source Sans 3',sans-serif}
.lang-fa{--display:'Noto Naskh Arabic','Oswald',sans-serif;
         --body:'Noto Naskh Arabic','Source Sans 3',sans-serif}
.lang-ur{--display:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif;
         --body:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif}
.lang-hy .label,.lang-ka .label,.lang-fa .label,.lang-ur .label{
  text-transform:none;letter-spacing:0}
/* Nastaliq is drawn on a steep diagonal and needs the room, or a two-line label
   collides with itself. */
.lang-ur .label{font-size:3.9cqh;line-height:1.9}
.lang-fa .label{line-height:1.6}

/* Every chip starts absent and is placed by seek(); nothing animates on its own, so
   frame n is the same image however busy the machine is. */
.head,.chip{opacity:0}
</style>

<div class="stage">
  <div class="head"></div>
  <div class="row">
    <div class="chip"><div class="mark"></div><div class="label"></div></div>
    <div class="chip"><div class="mark"></div><div class="label"></div></div>
    <div class="chip"><div class="mark"></div><div class="label"></div></div>
  </div>
</div>

<script>
/*
 * The words, and the second each one is spoken.
 *
 * The beats are not guesses: they are the narration's own word stamps, measured with
 * ElevenLabs Scribe and given here relative to the start of scene 10 (64.2s in the
 * film). A label appears as its phrase begins, so the picture says what the voice is
 * saying at that moment rather than a beat behind it.
 */
var COPY = {
  en: {
    head: 'Nothing.',
    at: 0.10,
    items: [
      { text: 'No subscription', at: 1.05 },
      { text: 'No set-up fee', at: 2.20 },
      { text: 'No charge per vehicle', at: 3.28 }
    ]
  },
  es: {
    head: 'Nada.',
    at: 0.15,
    items: [
      { text: 'Sin suscripción', at: 0.92 },
      { text: 'Sin costo de instalación', at: 2.18 },
      { text: 'Sin cargo por vehículo', at: 3.82 }
    ]
  },
  ru: {
    head: 'Нисколько.',
    at: 0.18,
    items: [
      { text: 'Без подписки', at: 0.82 },
      { text: 'Без платы за подключение', at: 1.68 },
      { text: 'Без платы за машину', at: 2.88 }
    ]
  },
  de: {
    head: 'Nichts.',
    at: 0.20,
    items: [
      { text: 'Keine Gebühr', at: 1.18 },
      { text: 'Keine Einrichtung', at: 2.12 },
      { text: 'Nichts pro Fahrzeug', at: 3.52 }
    ]
  },
  fr: {
    // "Rien" and "pas d'abonnement" are one breath in French; the head barely leads.
    head: 'Rien.',
    at: 0.10,
    items: [
      { text: "Pas d'abonnement", at: 0.18 },
      { text: 'Pas de mise en service', at: 1.18 },
      { text: 'Rien par véhicule', at: 2.50 }
    ]
  },
  pt: {
    head: 'Nada.',
    at: 0.10,
    items: [
      { text: 'Sem assinatura', at: 0.30 },
      { text: 'Sem taxa de instalação', at: 1.42 },
      { text: 'Sem cobrança por veículo', at: 3.06 }
    ]
  }
,
  uk: {
    head: 'Ніскільки.',
    at: 0.22,
    items: [
      { text: 'Без підписки', at: 0.98 },
      { text: 'Без плати за підключення', at: 1.64 },
      { text: 'Без плати за машину', at: 3.06 }
    ]
  },
  tr: {
    head: 'Hiç.',
    at: 0.20,
    items: [
      { text: 'Abonelik yok', at: 0.68 },
      { text: 'Kurulum ücreti yok', at: 1.46 },
      { text: 'Araç başına ücret yok', at: 2.52 }
    ]
  },
  zh: {
    head: '一分不要。',
    at: 0.38,
    items: [
      { text: '无订阅费', at: 1.52 },
      { text: '无安装费', at: 2.98 },
      { text: '不按车收费', at: 3.92 }
    ]
  },
  hy: {
    head: 'Ոչինչ։',
    at: 0.28,
    items: [
      { text: 'Առանց բաժանորդագրության', at: 1.04 },
      { text: 'Առանց միացման վճարի', at: 2.52 },
      { text: 'Առանց վճարի մեքենայի համար', at: 3.78 }
    ]
  },
  ka: {
    head: 'არაფერი.',
    at: 0.26,
    items: [
      { text: 'გამოწერის გარეშე', at: 1.12 },
      { text: 'ჩართვის საფასურის გარეშე', at: 2.10 },
      { text: 'მანქანაზე გადასახადის გარეშე', at: 3.70 }
    ]
  },
  fa: {
    // Scribe did not hear "هیچ" at all, so its stamp here is the start of the clip
    // itself rather than an interpolated one; the first item follows it immediately,
    // the way it does in French.
    head: 'هیچ.',
    at: 0.20,
    items: [
      { text: 'بدون اشتراک', at: 0.30 },
      { text: 'بدون هزینه راه‌اندازی', at: 1.46 },
      { text: 'بدون هزینه هر خودرو', at: 3.26 }
    ]
  },
  ur: {
    head: 'کچھ نہیں۔',
    at: 0.18,
    items: [
      { text: 'سبسکرپشن نہیں', at: 1.04 },
      { text: 'سیٹ اپ فیس نہیں', at: 2.18 },
      { text: 'فی گاڑی چارج نہیں', at: 3.34 }
    ]
  },
  // Uzbek is heard in English and read in Uzbek, so its beats are the English
  // narrator's: the labels land on the words the viewer is actually hearing.
  uz: {
    head: 'Hech narsa.',
    at: 0.18,
    items: [
      { text: 'Obuna yoʻq', at: 1.10 },
      { text: 'Ulanish toʻlovi yoʻq', at: 2.26 },
      { text: 'Mashina uchun toʻlov yoʻq', at: 3.14 }
    ]
  }
};

var lang = (location.search.match(/[?&]lang=([a-z]{2})/) || [, 'en'])[1];
var copy = COPY[lang] || COPY.en;
// The script decides the direction, and the direction has to reach the markup: given
// none, the browser lays Persian out left to right and puts the stop at the wrong end.
document.documentElement.setAttribute('dir', lang === 'fa' || lang === 'ur' ? 'rtl' : 'ltr');
document.querySelector('.stage').classList.add('lang-' + lang);
var head = document.querySelector('.head');
var chips = [].slice.call(document.querySelectorAll('.chip'));

head.textContent = copy.head;
chips.forEach(function (chip, i) {
  chip.querySelector('.label').textContent = copy.items[i].text;
});

// Ease-out cubic: quick to arrive, slow to settle, which is how the rest of the film moves.
function ease(x) { return 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3); }

function place(el, t, at, rise) {
  var k = ease((t - at) / 0.5);
  el.style.opacity = k;
  el.style.transform = 'translateY(' + ((1 - k) * rise).toFixed(2) + 'px) scale(' +
    (0.94 + 0.06 * k).toFixed(4) + ')';
}

window.__card = {
  // Six seconds of scene, plus a tail: the film dissolves out of this shot between
  // 70.10s and 70.30s, and the card has to stay opaque across that whole dissolve or
  // the lettering it is covering shows through underneath it.
  total: 6.3,
  lang: lang,
  seek: function (t) {
    place(head, t, copy.at, 26);
    chips.forEach(function (chip, i) { place(chip, t, copy.items[i].at, 34); });
  }
};

window.__card.seek(0);
</script>
