<meta charset="utf-8">
<title>End card (ZH-Hant)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@600;700&family=Noto+Sans+TC:wght@700;900&family=Noto+Sans+SC:wght@700;900&family=Noto+Sans+Armenian:wght@700;900&family=Noto+Sans+Georgian:wght@700;900&family=Noto+Naskh+Arabic:wght@700&family=Noto+Nastaliq+Urdu:wght@700&family=Roboto+Mono:wght@500;700&family=Source+Sans+3:wght@700;900&display=swap">

<style>
/*
 * The closing card the generator cannot be trusted to draw — ZH-Hant.
 *
 * Traditional Chinese, for the zh-Hant site locale. Same Mandarin recording as the
 * zh cut; only the writing differs, set in Noto Sans TC so the glyphs are the
 * traditional forms rather than Simplified shapes substituted per character.
 *
 * Everything else in the ToonBee cut is generated, and generated lettering drifts —
 * the money figure counted itself down mid-shot, the price discs came out reading
 * "5tv" and "3s". This is the one frame whose wording has to be exact, so it is drawn
 * here: the real logo file from the site, the campaign line, and the address.
 *
 * Light ground on purpose. The logo is black line art on white with no alpha channel,
 * and the film itself lives in a bright warm world — dropping to navy at the very end
 * would look like a different piece of film had been stapled on.
 */
:root{
  --paper:#eef2f7;
  --paper-hi:#ffffff;
  --ink:#0a1628;
  --muted:#5b6f8a;
  --accent-hot:#ef6c1f;
  --accent:#f5a524;
  --gain:#0b8f63;
  --display:'Anton','Oswald','Noto Sans TC','Noto Sans SC',"Arial Narrow",Impact,sans-serif;
  --body:'Source Sans 3','Noto Sans TC','Noto Sans SC',"Segoe UI",system-ui,sans-serif;
  --mono:'Roboto Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 90% at 50% 6%, var(--paper-hi) 0%, var(--paper) 58%, #dfe6ef 100%);
  color:var(--ink);font-family:var(--body);
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.card{width:100vw;height:100vh;container-type:size;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqh}

/* The logo file ships on its own near-white ground with no alpha channel, which sat
   on the card as a visible rectangle. logo-alpha.png is the same mark with that ground
   keyed out (ffmpeg lumakey), so only the line art lands here. */
.logo{width:46cqh}

.rule{width:11cqh;height:.5cqh;border-radius:.3cqh;margin:1.2cqh 0 .4cqh;
  background:linear-gradient(90deg,var(--accent),var(--accent-hot))}

.slogan{font-family:var(--display);font-size:11.5cqh;line-height:.94;text-align:center;letter-spacing:-.01em}
.slogan em{font-style:normal;color:var(--accent-hot)}

/* "Start earning" is not a figure of speech, so the card says what actually happens:
   the owner is paid the toll in full and a share of the fee charged to the renter.
   Verified against production — 136 toll charges, $2,648 of tolls, $4,242 paid out. */
.free{font-size:2.9cqh;font-weight:700;color:var(--muted);margin-top:1.4cqh;text-align:center;line-height:1.5}
.free b{color:var(--ink);font-weight:900}
.free i{font-style:normal;color:var(--gain);font-weight:900}

.url{font-family:var(--mono);font-size:2.8cqh;letter-spacing:.24em;color:var(--muted);
  text-transform:uppercase;margin-top:1.8cqh}

/*
 * The four scripts Anton cannot draw.
 *
 * A display face that has no glyph for a letter does not fail loudly; it silently
 * hands the letter to whatever the system has, so a card can come out in two
 * typefaces without anyone noticing until it is on screen. Each of these languages
 * therefore names its own face ahead of Anton, and the address keeps the mono face
 * in every one of them because it is a domain name, not a word.
 */
.lang-hy{--display:'Noto Sans Armenian','Oswald',sans-serif;
         --body:'Noto Sans Armenian','Source Sans 3',sans-serif}
.lang-ka{--display:'Noto Sans Georgian','Oswald',sans-serif;
         --body:'Noto Sans Georgian','Source Sans 3',sans-serif}
.lang-fa{--display:'Noto Naskh Arabic','Oswald',sans-serif;
         --body:'Noto Naskh Arabic','Source Sans 3',sans-serif}
.lang-ur{--display:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif;
         --body:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif}

/* Armenian and Georgian capitals are wider than Latin ones and their letterforms are
   rounder, so the slogan is set a little smaller to keep the two lines inside the frame. */
.lang-hy .slogan,.lang-ka .slogan{font-size:9.5cqh;line-height:1.06}

/* Arabic script hangs below the line and Nastaliq climbs steeply from right to left;
   at the Latin line-height the descenders of one line cut into the next. */
.lang-fa .slogan{font-size:9cqh;line-height:1.5}
.lang-ur .slogan{font-size:8cqh;line-height:1.9}
.lang-fa .free,.lang-ur .free{line-height:2}
.lang-ur .free{font-size:2.6cqh}
</style>

<div class="card lang-zh" lang="zh-Hant">
  <img class="logo" src="logo-alpha.png" alt="MyEZToll">
  <div class="rule"></div>
  <div class="slogan">別再虧損。<br><em>開始賺錢。</em></div>
  <div class="free">車隊東主免費。<br>
    <b>過路費全額歸您</b> — 再加 <i>我們佣金的一部分</i>。</div>
  <div class="url">myeztoll.com</div>
</div>
