<meta charset="utf-8">
<title>Facebook page cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=Roboto+Mono:wght@500&display=swap">

<style>
/*
 * The cover photo of the Facebook page, drawn at 1640 x 624 — the size Facebook asks a
 * Page for, and the one it downscales from for every surface.
 *
 * Two crops have to survive: the desktop strip keeps almost the whole frame but the
 * page's round profile picture sits over the BOTTOM LEFT corner, and the phone shows a
 * narrower centre. So everything that has to be read lives in `.safe` — a centred
 * 1000 x 420 box — and the bottom-left corner is left as ground on purpose. The outline
 * is drawn only with ?guides, so a render is clean.
 *
 * Palette and type are the film's closing card and the YouTube banner: someone who
 * arrives from either should not think they have landed somewhere else.
 */
:root{
  --paper:#eef2f7;
  --paper-hi:#ffffff;
  --ink:#0a1628;
  --muted:#5b6f8a;
  --accent-hot:#ef6c1f;
  --accent-cool:#0b8f63;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1640px;height:624px;overflow:hidden}
body{
  background:radial-gradient(120% 100% at 50% 16%, var(--paper-hi) 0%, var(--paper) 58%, #dfe6ef 100%);
  color:var(--ink);
  font-family:'Oswald',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
}

.road{position:absolute;inset:0;overflow:hidden}
.road svg{position:absolute;inset:0;width:100%;height:100%}

.safe{
  position:relative;
  width:1000px;height:420px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;
}
.guides .safe{outline:2px dashed #ef6c1f80}

.slogan{
  font-family:'Anton',sans-serif;
  font-size:82px;line-height:.98;letter-spacing:-.005em;text-align:center;
}
.slogan em{font-style:normal;color:var(--accent-hot)}

.line{
  font-weight:500;font-size:24px;letter-spacing:.02em;color:var(--muted);
  text-align:center;max-width:1000px;line-height:1.32;white-space:nowrap;
}
.line b{color:var(--ink);font-weight:700}
.line i{font-style:normal;color:var(--accent-cool);font-weight:700}

.url{
  font-family:'Roboto Mono',monospace;font-weight:500;
  font-size:23px;letter-spacing:.28em;color:var(--muted);
}
</style>

<div class="road">
  <svg viewBox="0 0 1640 624" preserveAspectRatio="none">
    <path d="M-40 624 C 340 520, 620 470, 1680 452" fill="none" stroke="#1e3a5f" stroke-opacity=".10" stroke-width="22"/>
    <path d="M-40 624 C 380 552, 680 500, 1680 486" fill="none" stroke="#ef6c1f" stroke-opacity=".13" stroke-width="16"/>
    <path d="M-40 34 C 420 92, 720 116, 1680 96" fill="none" stroke="#1e3a5f" stroke-opacity=".07" stroke-width="18"/>
  </svg>
</div>

<div class="safe">
  <div class="slogan">Stop losing. <em>Start earning.</em></div>
  <div class="line">Toll &amp; ticket recovery for rental fleets — <b>free for the owner</b>, <i>who keeps a share of the fee</i></div>
  <div class="url">MYEZTOLL.COM</div>
</div>

<script>
if (location.search.includes('guides')) document.documentElement.classList.add('guides');
</script>
